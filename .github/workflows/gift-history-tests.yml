name: Gift and reaction history regression tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'submodules/TelegramCore/Sources/TelegramEngine/Payments/StarGifts.swift'
      - 'submodules/TelegramUI/Components/PeerInfo/PeerInfoVisualMediaPaneNode/Sources/GiftsListView.swift'
      - 'Tests/profile_gift_history/**'
      - 'Tests/removed_reactions/**'
      - 'Donutgram/DGSimpleSettings/**'
      - 'submodules/TelegramCore/Sources/ApiUtils/ReactionsMessageAttribute.swift'
      - 'submodules/TelegramCore/Sources/SyncCore/SyncCore_ReactionsMessageAttribute.swift'
      - 'submodules/TelegramCore/Sources/SyncCore/SyncCore_StandaloneAccountTransaction.swift'
      - '.github/workflows/gift-history-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gift-history:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check production Swift ordering and deletion helpers
        run: python3 Tests/profile_gift_history/run.py
      - name: Check production removed-reaction retention and presentation helpers
        run: python3 Tests/removed_reactions/run.py
