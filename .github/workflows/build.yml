name: Build Donutgram IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A new push to a PR, or a new dispatch on the same branch, cancels that
# branch's unfinished build. A running master build is never cancelled:
# the next master push waits for it (only the newest waiting push runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      app_version: ${{ steps.build.outputs.app_version }}
      build_number: ${{ steps.build.outputs.build_number }}
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check chat settings behavior and persistence
        shell: bash
        run: |
          set -euo pipefail
          swiftc Donutgram/DGSimpleSettings/Sources/*.swift Donutgram/DGFeatureTests/SettingsBehavior/main.swift -o "$RUNNER_TEMP/dg-settings-checks"
          suite="donutgram-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/dg-settings-checks" write "$suite"
          "$RUNNER_TEMP/dg-settings-checks" read "$suite"

      - name: Validate Telegram API credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TG_API_ID:-}" ] || [ -z "${TG_API_HASH:-}" ]; then
            echo "::error::Missing GitHub Secrets TG_API_ID and TG_API_HASH. Create your own Telegram API application at my.telegram.org and add both values under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! [[ "$TG_API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::TG_API_ID must contain digits only."
            exit 1
          fi
          if [ "${#TG_API_HASH}" -lt 16 ]; then
            echo "::error::TG_API_HASH does not look valid."
            exit 1
          fi
          echo "Telegram API credentials are configured."

      - name: Select required Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Required Xcode not found: $XCODE_PATH"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sw_vers

      # A PR's own entries carry its number (see «Save Bazel disk cache»), so
      # its next push restores them before master's.
      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: donutgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.event.pull_request.number && format('pr{0}-', github.event.pull_request.number) || '' }}${{ github.sha }}
          restore-keys: |
            donutgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.event.pull_request.number && format('pr{0}-', github.event.pull_request.number) || '' }}
            donutgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-

      - name: Prepare canonical source path
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared/telegram-ios
          sudo chown -R "$(id -u):$(id -g)" /Users/Shared/telegram-ios
          rsync -a --delete "$GITHUB_WORKSPACE/" /Users/Shared/telegram-ios/

      - name: Build unsigned IPA
        id: build
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_telegram_ios"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "Build number: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "app_version=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')" >> "$GITHUB_OUTPUT"

          export CONFIG_PATH="$RUNNER_TEMP/donutgram-configuration.json"
          python3 - <<'PY'
          import json
          import os

          source = "build-system/donutgram-configuration.json"
          destination = os.environ["CONFIG_PATH"]

          with open(source, "r", encoding="utf-8") as file:
              config = json.load(file)

          # The repository's fake provisioning profile is issued for Telegram's
          # build-time bundle id. Sideloadly will re-sign the final IPA, so we
          # change the installed identity to com.kittenello.donutgram after Bazel
          # has produced the application.
          config["bundle_id"] = "ph.telegra.Telegraph"
          config["api_id"] = os.environ["TG_API_ID"]
          config["api_hash"] = os.environ["TG_API_HASH"]

          with open(destination, "w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
              file.write("\n")
          PY

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --continueOnError \
            --configurationPath="$CONFIG_PATH" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"

          IPA_PATH="$SOURCE_DIR/bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "Telegram.ipa was not found at: $IPA_PATH"
            find "$SOURCE_DIR/bazel-bin" -type f -name '*.ipa' -print || true
            exit 1
          fi

          PACKAGE_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$PACKAGE_DIR"

          APP_PATH="$(find "$PACKAGE_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found inside IPA"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.kittenello.donutgram" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Donutgram" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Donutgram" "$APP_PATH/Info.plist"

          # Extensions require App Groups / extra capabilities that free sideload
          # certificates often do not provide. The Bazel build already disables
          # them, but remove PlugIns defensively if one is present.
          rm -rf "$APP_PATH/PlugIns"

          (
            cd "$PACKAGE_DIR"
            zip -qry "$GITHUB_WORKSPACE/build-artifacts/Donutgram.ipa" Payload
          )

          echo "Final IPA identity:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist"
          ls -lh "$GITHUB_WORKSPACE/build-artifacts/Donutgram.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Donutgram-IPA
          path: build-artifacts/Donutgram.ipa
          if-no-files-found: error
          retention-days: 14

      # Only master saves the ~6 GB cache. The repository cache limit is 10 GB,
      # so an entry saved by a branch evicts master's, while other branches
      # cannot restore a branch's entry and fall back to a cold build.
      # Exception: a PR whose versions.json or MODULE.bazel changed finds no
      # master entry, so it restores nothing or only its own earlier entry
      # (the key carries the PR number). Such a run saves, so each next push to
      # that PR starts from the previous one. A failed build saves too: the
      # disk cache only holds finished actions, and with --continueOnError
      # those are everything the error didn't block.
      - name: Save Bazel disk cache
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/master' || steps.bazel-cache.outputs.cache-matched-key == '' || (github.event.pull_request.number && contains(steps.bazel-cache.outputs.cache-matched-key, format('-pr{0}-', github.event.pull_request.number)))) }}
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  # Every master build replaces the content of the «ipa» branch with the IPA
  # and an AltStore-format source. Add this URL as a source in the installer:
  # https://raw.githubusercontent.com/kittenello/Donutgram/ipa/source.json
  # The installer offers the update for an app installed from that source.
  # The branch is one commit, force-pushed each time, so old IPAs do not
  # accumulate in the repository. A file pushed to git must stay under
  # GitHub's 100 MB limit; the IPA is about 76 MB.
  publish:
    name: Publish IPA source
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two master builds finishing together must not overwrite each other's
    # branch out of order.
    concurrency:
      group: ipa-source
      cancel-in-progress: false
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout publish script
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/ipa

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Donutgram-IPA
          path: build-artifacts

      - name: Publish IPA and source to the ipa branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The IPA name carries the build number so raw.githubusercontent.com's
          # cache never serves an older IPA under the new source's URL.
          IPA_NAME="Donutgram-$BUILD_NUMBER.ipa"
          SITE="$RUNNER_TEMP/ipa-site"
          mkdir -p "$SITE"
          cp build-artifacts/Donutgram.ipa "$SITE/$IPA_NAME"

          IPA_PATH="$SITE/$IPA_NAME" \
          DOWNLOAD_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/ipa/$IPA_NAME" \
            python3 .github/ipa/update_source.py "$SITE/source.json"
          cat "$SITE/source.json"

          cd "$SITE"
          git init -q -b ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Donutgram $APP_VERSION ($BUILD_NUMBER)"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" ipa
