name: Local read and chat controls tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'Donutgram/DGSimpleSettings/**'
      - 'Donutgram/DGSettingsUI/**'
      - 'submodules/TelegramCore/Sources/Donutgram/DonutgramGhostLocalRead.swift'
      - 'submodules/TelegramCore/Sources/TelegramEngine/Messages/DonutgramReadAllMessages.swift'
      - 'submodules/TelegramCore/Sources/TelegramEngine/Messages/TelegramEngineMessages.swift'
      - 'submodules/TelegramCore/Sources/State/**'
      - 'submodules/ChatListUI/**'
      - 'submodules/TelegramUI/**'
      - 'Tests/local_read_controls/**'
      - '.github/workflows/local-read-controls-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check production read state and settings persistence
        run: python3 Tests/local_read_controls/run.py
      - name: Parse changed Swift sources
        run: |
          swiftc -frontend -parse Donutgram/DGSettingsUI/Sources/*.swift submodules/ChatListUI/Sources/Node/ChatListNode.swift submodules/ChatListUI/Sources/Node/ChatListNodeEntries.swift submodules/ChatListUI/Sources/ChatListControllerNode.swift submodules/TelegramUI/Sources/ChatInterfaceInputContexts.swift submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreenMultilineInputtem.swift submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift
