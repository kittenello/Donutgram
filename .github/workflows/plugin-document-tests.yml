name: Plugin document import tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'Donutgram/DGPluginsUI/**'
      - 'Donutgram/DGPluginModel/**'
      - 'submodules/SSignalKit/SwiftSignalKit/Source/**'
      - 'submodules/MergeLists/Sources/**'
      - 'submodules/TelegramUI/Sources/OpenChatMessage.swift'
      - 'Tests/plugin_document_import/**'
      - 'Tests/plugin_ui_layout/**'
      - '.github/workflows/plugin-document-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check attachment validation, cancellation and list node transitions
        run: python3 Tests/plugin_document_import/run.py
      - name: Check plugin card geometry
        run: python3 Tests/plugin_ui_layout/run.py
